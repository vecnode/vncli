# cargo-deny configuration for vncli
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# RUSTSEC advisories database - uses cargo-deny's built-in default source
# (a git clone of https://github.com/rustsec/advisory-db).
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Use permissive licenses only - this is an allow-list; anything not listed
# here (including GPL/AGPL/SSPL/other copyleft) is rejected by default.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # Community Data License Agreement Permissive 2.0 - used by webpki-roots
    # for its bundled CA certificate data, not code.
    "CDLA-Permissive-2.0",
    # Weak (file-level) copyleft, not viral like GPL/AGPL - used by option-ext
    # (a small dirs-sys dependency).
    "MPL-2.0",
]

# vncli itself is AGPL-3.0. That is deliberately NOT added to the allow-list
# above, which governs what we are willing to *depend on* and stays
# permissive-only; this exception is scoped to our own crate so a new AGPL
# dependency would still be rejected.
[[licenses.exceptions]]
crate = "vn"
allow = ["AGPL-3.0-only"]

# ollama-rs's published Cargo.toml doesn't declare a license field, so
# cargo-deny can't verify it from metadata alone. Its repo's LICENSE.md
# confirms MIT (github.com/pepperoni21/ollama-rs). The hash below is a
# placeholder pending the real value cargo-deny reports on first run.
[[licenses.clarify]]
crate = "ollama-rs"
expression = "MIT"
license-files = [
    { path = "LICENSE.md", hash = 0x00000000 },
]

[bans]
# Ban certain crates or versions
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = [
    # We only ever want rustls. openssl still shows up transitively via
    # ollama-rs's own reqwest dependency, which doesn't disable reqwest's
    # default-tls feature - Cargo's feature unification then pulls it into
    # our single resolved reqwest too, even though our own direct reqwest
    # dependency is rustls-only and that's the only TLS path our code uses.
    # Allow it only when reached through native-tls (its sole entry point
    # here) so a *new*, unrelated openssl dependency would still be caught.
    { name = "openssl", version = "*", wrappers = ["native-tls"] },
]
skip-tree = []

[sources]
# Only allow crates from reputable sources
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
