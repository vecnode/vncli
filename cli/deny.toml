# cargo-deny configuration for vncli
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# RUSTSEC advisories database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db/raw/main/db.toml.gz"]
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
# Use permissive licenses only - this is an allow-list; anything not listed
# here (including GPL/AGPL/SSPL/other copyleft) is rejected by default.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
# Ban certain crates or versions
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = [
    # Unstable or unmaintained crates
    { name = "openssl", version = "*" }, # Use rustls instead
]
skip-tree = []

[sources]
# Only allow crates from reputable sources
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
